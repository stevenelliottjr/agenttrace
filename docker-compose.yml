version: '3.8'

services:
  # TimescaleDB (PostgreSQL with time-series extensions)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: agenttrace-db
    environment:
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace_dev
      POSTGRES_DB: agenttrace
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for pub/sub and caching
  redis:
    image: redis:7-alpine
    container_name: agenttrace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # AgentTrace Collector (Rust)
  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.collector
    container_name: agenttrace-collector
    ports:
      - "8080:8080"     # HTTP API
      - "4317:4317"     # gRPC
      - "4318:4318/udp" # UDP
    environment:
      DATABASE_URL: postgres://agenttrace:agenttrace_dev@timescaledb:5432/agenttrace
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,agenttrace=debug
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Web Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: agenttrace-dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  timescaledb_data:
  redis_data:

networks:
  default:
    name: agenttrace-network
