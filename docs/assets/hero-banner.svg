<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-hero)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Glowing orbs -->
  <ellipse cx="200" cy="200" rx="150" ry="150" fill="url(#glow)" filter="url(#blur-glow)"/>
  <ellipse cx="1000" cy="250" rx="200" ry="200" fill="url(#glow)" filter="url(#blur-glow)"/>

  <!-- Logo/Brand -->
  <g transform="translate(100, 140)">
    <!-- Icon -->
    <rect x="0" y="0" width="50" height="50" rx="10" fill="url(#accent-hero)"/>
    <path d="M 15 25 L 25 15 L 35 25 L 25 35 Z" fill="#fff" opacity="0.9"/>
    <circle cx="25" cy="25" r="5" fill="#fff"/>

    <!-- Brand name -->
    <text x="70" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">
      AgentTrace
    </text>
  </g>

  <!-- Tagline -->
  <text x="100" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8">
    Datadog for AI Agents
  </text>

  <!-- Feature pills -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="70" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle">Real-time Traces</text>

    <rect x="155" y="0" width="130" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="220" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#c4b5fd" text-anchor="middle">Cost Tracking</text>

    <rect x="300" y="0" width="140" height="32" rx="16" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
    <text x="370" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#d8b4fe" text-anchor="middle">&lt;1ms Overhead</text>

    <rect x="455" y="0" width="120" height="32" rx="16" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
    <text x="515" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Local-First</text>
  </g>

  <!-- One-liner install box -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="500" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#94a3b8">$</text>
    <text x="30" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#f8fafc">curl -fsSL </text>
    <text x="130" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#a5b4fc">https://agenttrace.dev/install</text>
    <text x="382" y="28" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#f8fafc"> | bash</text>
  </g>

  <!-- Mini dashboard preview on right -->
  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="420" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Mini header -->
    <rect x="0" y="0" width="420" height="35" rx="12" fill="#334155"/>
    <rect x="0" y="20" width="420" height="15" fill="#334155"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="40" cy="17" r="5" fill="#eab308"/>
    <circle cx="60" cy="17" r="5" fill="#22c55e"/>
    <text x="100" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">AgentTrace Dashboard</text>

    <!-- Mini metric cards -->
    <rect x="15" y="50" width="90" height="50" rx="6" fill="#334155"/>
    <text x="25" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Cost (24h)</text>
    <text x="25" y="88" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">$47.82</text>

    <rect x="115" y="50" width="90" height="50" rx="6" fill="#334155"/>
    <text x="125" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Tokens</text>
    <text x="125" y="88" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">2.4M</text>

    <rect x="215" y="50" width="90" height="50" rx="6" fill="#334155"/>
    <text x="225" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Latency</text>
    <text x="225" y="88" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">1.8s</text>

    <rect x="315" y="50" width="90" height="50" rx="6" fill="#334155"/>
    <text x="325" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Errors</text>
    <text x="325" y="88" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#22c55e">0.3%</text>

    <!-- Mini chart area -->
    <rect x="15" y="115" width="195" height="130" rx="6" fill="#334155"/>
    <path d="M 30 210 Q 60 190 90 195 T 150 175 T 190 165" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path d="M 30 210 Q 60 190 90 195 T 150 175 T 190 165 L 190 230 L 30 230 Z" fill="#6366f1" fill-opacity="0.2"/>

    <!-- Mini bar chart -->
    <rect x="220" y="115" width="185" height="130" rx="6" fill="#334155"/>
    <rect x="235" y="140" width="140" height="14" rx="3" fill="#6366f1"/>
    <rect x="235" y="162" width="90" height="14" rx="3" fill="#8b5cf6"/>
    <rect x="235" y="184" width="50" height="14" rx="3" fill="#a855f7"/>
    <rect x="235" y="206" width="30" height="14" rx="3" fill="#c084fc"/>
  </g>
</svg>
