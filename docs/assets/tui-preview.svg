<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="tui-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Terminal window chrome -->
  <rect width="900" height="500" rx="12" fill="url(#tui-bg)" stroke="#334155" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="40" rx="12" fill="#1e293b"/>
  <rect x="0" y="28" width="900" height="12" fill="#1e293b"/>

  <!-- Window buttons -->
  <circle cx="25" cy="20" r="7" fill="#ef4444"/>
  <circle cx="50" cy="20" r="7" fill="#eab308"/>
  <circle cx="75" cy="20" r="7" fill="#22c55e"/>

  <!-- Title -->
  <text x="450" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">agenttrace dashboard</text>

  <!-- TUI Header -->
  <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6366f1" font-weight="bold">AgentTrace</text>
  <text x="130" y="70" font-family="'JetBrains Mono', monospace" font-size="14" fill="#64748b">v0.1.0</text>
  <text x="700" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">Press ? for help</text>

  <!-- Separator -->
  <line x1="20" y1="85" x2="880" y2="85" stroke="#334155" stroke-width="1"/>

  <!-- Stats bar -->
  <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Sessions:</text>
  <text x="100" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22c55e">3 active</text>
  <text x="200" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Traces:</text>
  <text x="270" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">1,247</text>
  <text x="350" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Cost:</text>
  <text x="400" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#eab308">$47.82</text>
  <text x="500" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Tokens:</text>
  <text x="570" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b5cf6">2.4M</text>

  <!-- Separator -->
  <line x1="20" y1="125" x2="880" y2="125" stroke="#334155" stroke-width="1"/>

  <!-- Table header -->
  <text x="20" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">SESSION</text>
  <text x="280" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">MODEL</text>
  <text x="450" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">TOKENS</text>
  <text x="550" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">COST</text>
  <text x="640" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">DURATION</text>
  <text x="760" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">STATUS</text>

  <!-- Selected row highlight -->
  <rect x="15" y="160" width="870" height="25" fill="#6366f1" fill-opacity="0.2"/>

  <!-- Row 1 (selected) -->
  <text x="20" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">> code-review-abc123</text>
  <text x="280" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a5b4fc">claude-opus-4</text>
  <text x="450" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">45,231</text>
  <text x="550" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#eab308">$0.89</text>
  <text x="640" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">5m 23s</text>
  <text x="760" y="178" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22c55e">ACTIVE</text>

  <!-- Row 2 -->
  <text x="20" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">  research-def456</text>
  <text x="280" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">claude-sonnet-4</text>
  <text x="450" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">128,456</text>
  <text x="550" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">$2.34</text>
  <text x="640" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">12m 07s</text>
  <text x="760" y="203" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1">DONE</text>

  <!-- Row 3 -->
  <text x="20" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">  bugfix-ghi789</text>
  <text x="280" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">gpt-4o</text>
  <text x="450" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">22,100</text>
  <text x="550" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">$0.45</text>
  <text x="640" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">3m 45s</text>
  <text x="760" y="228" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ef4444">ERROR</text>

  <!-- Separator -->
  <line x1="20" y1="250" x2="880" y2="250" stroke="#334155" stroke-width="1"/>

  <!-- Trace detail panel -->
  <text x="20" y="275" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6366f1" font-weight="bold">TRACE DETAIL</text>

  <!-- Waterfall view -->
  <text x="20" y="300" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">code-review-abc123</text>
  <rect x="200" y="290" width="600" height="14" rx="2" fill="#334155"/>
  <rect x="200" y="290" width="580" height="14" rx="2" fill="#6366f1" fill-opacity="0.5"/>

  <text x="40" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">llm.request</text>
  <rect x="200" y="315" width="600" height="14" rx="2" fill="#334155"/>
  <rect x="210" y="315" width="300" height="14" rx="2" fill="#8b5cf6"/>

  <text x="60" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">tool.read_file</text>
  <rect x="200" y="340" width="600" height="14" rx="2" fill="#334155"/>
  <rect x="520" y="340" width="80" height="14" rx="2" fill="#22c55e"/>

  <text x="60" y="375" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">tool.write_file</text>
  <rect x="200" y="365" width="600" height="14" rx="2" fill="#334155"/>
  <rect x="610" y="365" width="60" height="14" rx="2" fill="#22c55e"/>

  <text x="40" y="400" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">llm.request</text>
  <rect x="200" y="390" width="600" height="14" rx="2" fill="#334155"/>
  <rect x="680" y="390" width="100" height="14" rx="2" fill="#8b5cf6"/>

  <!-- Time scale -->
  <text x="200" y="430" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">0s</text>
  <text x="400" y="430" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">1m</text>
  <text x="600" y="430" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">2m</text>
  <text x="780" y="430" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">3m</text>

  <!-- Footer -->
  <line x1="20" y1="450" x2="880" y2="450" stroke="#334155" stroke-width="1"/>
  <text x="20" y="475" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">j/k: navigate | Enter: expand | r: refresh | q: quit | /: filter</text>
</svg>
