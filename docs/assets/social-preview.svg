<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg-social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-social" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glow-social" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur-social" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-social)"/>

  <!-- Subtle grid -->
  <pattern id="grid-social" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.2"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid-social)"/>

  <!-- Glowing orbs -->
  <ellipse cx="150" cy="320" rx="200" ry="200" fill="url(#glow-social)" filter="url(#blur-social)"/>
  <ellipse cx="1100" cy="400" rx="250" ry="250" fill="url(#glow-social)" filter="url(#blur-social)"/>

  <!-- Floating trace lines decoration -->
  <g opacity="0.3">
    <path d="M 0 150 Q 200 120 400 180 T 800 140 T 1280 200" fill="none" stroke="#6366f1" stroke-width="2"/>
    <path d="M 0 500 Q 300 480 600 520 T 1000 470 T 1280 510" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <!-- Logo Icon -->
  <g transform="translate(540, 150)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#accent-social)"/>
    <path d="M 24 40 L 40 24 L 56 40 L 40 56 Z" fill="#fff" opacity="0.9"/>
    <circle cx="40" cy="40" r="8" fill="#fff"/>
  </g>

  <!-- Brand Name -->
  <text x="640" y="300" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" text-anchor="middle">
    AgentTrace
  </text>

  <!-- Tagline -->
  <text x="640" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">
    Datadog for AI Agents
  </text>

  <!-- Feature highlights -->
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
    <text x="75" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">Real-time Traces</text>

    <rect x="170" y="0" width="140" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="240" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#c4b5fd" text-anchor="middle">Cost Tracking</text>

    <rect x="330" y="0" width="140" height="40" rx="20" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
    <text x="400" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#d8b4fe" text-anchor="middle">&lt;1ms Overhead</text>

    <rect x="490" y="0" width="120" height="40" rx="20" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
    <text x="550" y="26" font-family="system-ui, sans-serif" font-size="15" fill="#86efac" text-anchor="middle">Local-First</text>
  </g>

  <!-- Bottom install hint -->
  <g transform="translate(440, 530)">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#64748b">$</text>
    <text x="40" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#f8fafc">curl -fsSL agenttrace.dev/install | bash</text>
  </g>
</svg>
